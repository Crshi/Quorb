<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>quorb sidepanel test</title></head>

<script src="/test/mock-chrome.js"></script>
<header><span id="refresh"></span><span id="options"></span></header>
<div id="main"></div>
<script type="module" src="/src/sidepanel/panel.js"></script>
<script>setTimeout(function(){document.title += "|T:" + (document.querySelector('.foot') ? 'RENDERED' : 'EMPTY');}, 1200);</script>
</body>
</html>
