<!doctype html>
<html><head><meta charset="utf-8"><title>icons</title></head>
<body style="margin:0;background:#fff">
<canvas id="c" width="256" height="256" style="display:none"></canvas>
<pre id="out" style="display:none"></pre>
<div id="preview" style="display:flex;gap:12px;align-items:flex-end;padding:20px"></div>
<script>
function draw(ctx, S){
  ctx.clearRect(0,0,S,S);
  const cx=S/2, cy=S/2, R=S*0.46;
  // 玻璃底盘
  let g=ctx.createLinearGradient(0,S,S*0.25,0);
  g.addColorStop(0,'rgba(235,250,250,0.98)');
  g.addColorStop(1,'rgba(205,236,238,0.98)');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  // 轨道
  ctx.beginPath();ctx.arc(cx,cy,S*0.385,0,Math.PI*2);
  ctx.strokeStyle='rgba(25,55,80,0.16)';ctx.lineWidth=S*0.08;ctx.stroke();
  // 进度 68%
  const g2=ctx.createLinearGradient(0,S,S,0);
  g2.addColorStop(0,'#149a9e');g2.addColorStop(1,'#5cc6cc');
  ctx.beginPath();ctx.arc(cx,cy,S*0.385,-Math.PI/2,-Math.PI/2+Math.PI*2*0.68);
  ctx.strokeStyle=g2;ctx.lineWidth=S*0.08;ctx.lineCap='round';ctx.stroke();
  // 顶部高光
  const g3=ctx.createRadialGradient(cx-S*0.16,cy-S*0.2,S*0.02,cx-S*0.16,cy-S*0.2,S*0.34);
  g3.addColorStop(0,'rgba(255,255,255,0.95)');g3.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g3;ctx.fill();
  // 高光点
  ctx.beginPath();ctx.ellipse(cx-S*0.14,cy-S*0.17,S*0.09,S*0.05,-0.5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill();
}
const sizes=[128,48,32,16];
const out={};
for(const S of sizes){
  const c=document.getElementById('c');
  c.width=S;c.height=S;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,S,S);
  draw(ctx,S);
  out['icon'+S+'.png']=c.toDataURL('image/png');
  if(S===128){
    const img=document.createElement('img');img.src=out['icon128.png'];img.width=128;
    document.getElementById('preview').appendChild(img);
  }
}
document.getElementById('out').textContent='QUORBICONS::'+JSON.stringify(out);
document.title='ICONS READY';
</script>
</body></html>
