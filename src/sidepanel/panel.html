<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>quorb</title>
<style>
:root{
  --ink:oklch(24% .02 255);--sub:oklch(47% .015 255);--faint:oklch(62% .01 255);
  --line:rgba(20,30,60,.08);--acc:oklch(52% .115 205);--acc2:oklch(72% .085 190);
  --warn:oklch(72% .135 75);--crit:oklch(60% .19 22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  font-size:13px;line-height:1.65;color:var(--ink);background:oklch(97.4% .004 100);min-height:100vh
}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;padding:12px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.72));
  box-shadow:inset 0 -1px 0 var(--line)}
header .name{font-weight:600;font-size:14.5px;letter-spacing:-.02em;flex:1}
.ibtn{width:28px;height:28px;border-radius:9999px;border:none;cursor:pointer;background:rgba(20,30,60,.06);
  color:var(--sub);display:flex;align-items:center;justify-content:center}
.ibtn:hover{background:rgba(20,30,60,.1);color:var(--ink)}
.ibtn svg{width:13px;height:13px}
main{padding:14px 16px 20px}
.hero{display:flex;align-items:baseline;gap:8px}
.hero .big{font-size:40px;font-weight:600;letter-spacing:-.045em;line-height:1}
.hero .big.warn{color:oklch(58% .12 70)}
.hero .big.crit{color:var(--crit)}
.hero .unit{font-size:12px;color:var(--faint)}
.hero .balance{margin-left:auto;font-size:11px;color:var(--sub);text-align:right;line-height:1.55}
.hero .balance b{color:var(--ink)}
.tight{margin:10px 0 2px;font-size:10.5px;font-weight:500;color:oklch(52% .12 70);display:flex;align-items:center;gap:6px}
.tight::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--warn);flex:none}
.sec{font-size:10px;color:var(--faint);letter-spacing:.04em;font-weight:500;margin:16px 0 8px}
.wins{display:flex;flex-direction:column;gap:8px}
.win{padding:11px 13px;border-radius:14px;background:rgba(20,30,60,.045)}
.win.binding{box-shadow:inset 0 0 0 1.5px oklch(72% .135 75/.5)}
.w-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.w-label{font-size:11px;font-weight:600;color:var(--sub)}
.w-bind{font-size:9px;font-weight:600;color:oklch(52% .12 70);background:oklch(72% .135 75/.16);padding:1px 7px;border-radius:99px}
.w-bar{height:4px;border-radius:99px;background:rgba(20,30,60,.09);overflow:hidden;margin-bottom:7px}
.w-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.win.binding .w-bar i{background:linear-gradient(90deg,oklch(64% .13 70),var(--warn))}
.w-meta{font-size:11.5px;font-weight:600}
.w-meta .mu{color:var(--faint);font-weight:400}
.w-reset{font-size:10px;color:var(--faint);margin-top:2px}
.win.binding .w-reset{color:oklch(52% .12 70);font-weight:500}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:8px}
.foot .grow{flex:1}
.foot a{color:var(--acc);cursor:pointer;font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .warn{color:oklch(58% .12 70);font-weight:600}
.foot .err{color:var(--crit);font-weight:600}
.empty{padding:40px 20px;text-align:center}
.empty .ghost{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;
  border:1.5px dashed rgba(20,30,60,.28);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.empty h4{font-size:14px;font-weight:600;margin-bottom:6px}
.empty p{font-size:11px;color:var(--sub);margin-bottom:14px;line-height:1.7}
.cta{display:inline-block;border:none;cursor:pointer;font-size:11.5px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,oklch(58% .12 205),oklch(48% .115 205));
  padding:8.5px 22px;border-radius:9999px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px -6px oklch(52% .115 205/.6)}
.cta:hover{transform:translateY(-1px)}
.tinynote{font-size:10px;color:var(--faint);margin-top:10px}
/* P2 · 连接卡片（多连接聚合视图） */
.conn{padding:12px 14px;border-radius:16px;background:rgba(20,30,60,.045);margin-bottom:10px}
.conn.is-bind{box-shadow:inset 0 0 0 1.5px oklch(72% .135 75/.5)}
.conn.off{opacity:.55}
.conn-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pbadge{width:22px;height:22px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,oklch(52% .115 205/.16),oklch(72% .085 190/.16));color:oklch(45% .1 205)}
.pbadge svg{width:13px;height:13px}
.conn-name{font-size:12px;font-weight:600}
.conn-plan{margin-left:auto;font-size:9px;color:var(--faint);font-weight:500}
.conn-state{font-size:10px;color:var(--faint);margin-bottom:8px}
.conn-state.bad{color:var(--crit);font-weight:500}
.conn .wins{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0}
.conn .win{background:rgba(255,255,255,.65)}
</style>
</head>
<body>
<header>
  <svg width="20" height="20" viewBox="0 0 56 56"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="oklch(52% .115 205)"/><stop offset="1" stop-color="oklch(72% .085 190)"/></linearGradient></defs><circle cx="28" cy="28" r="23" fill="rgba(20,30,60,.05)"/><circle cx="28" cy="28" r="21" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="94 38" transform="rotate(-90 28 28)"/></svg>
  <span class="name">quorb</span>
  <button class="ibtn" id="refresh" title="立即同步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
  <button class="ibtn" id="options" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
</header>
<main id="main"></main>
<script type="module" src="panel.js"></script>
</body>
</html>
